server:
  port: ${PORT:8081}

spring:
  application:
    name: jobbeacon-sync
  profiles:
    active: ${PROFILE_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

sync:
  mode: ${SYNC_MODE:stream}
  slot-name: ${SYNC_SLOT_NAME:jobbeacon_search}
  publication-name: ${SYNC_PUBLICATION_NAME:jobbeacon_search}
  topic-prefix: jobbeacon
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    index: ${ELASTICSEARCH_JOB_INDEX:jobs}

eureka:
  client:
    # Turn off (EUREKA_ENABLED=false) to run the service without the discovery server.
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Register the container/host IP rather than the hostname, so other services can reach it inside Docker.
    prefer-ip-address: true
