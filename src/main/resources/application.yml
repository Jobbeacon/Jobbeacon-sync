server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: jobbeacon-sync
  profiles:
    active: ${PROFILE_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

sync:
  mode: ${SYNC_MODE:stream}
  slot-name: ${SYNC_SLOT_NAME:jobbeacon_search}
  publication-name: ${SYNC_PUBLICATION_NAME:jobbeacon_search}
  topic-prefix: jobbeacon
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    index: ${ELASTICSEARCH_JOB_INDEX:jobs}
